name: Ranq audit
description: Audit a site for SEO, AEO and GEO issues on deploy, upload the report, and optionally fail the job.
author: H3M4N1H
branding:
  icon: search
  color: blue

inputs:
  url:
    description: Site URL to audit (e.g. your preview or production URL).
    required: true
  max-pages:
    description: Maximum pages to crawl.
    default: "200"
  fail-on:
    description: Fail if issues at or above this severity exist (critical, high, medium, low, never).
    default: critical
  render:
    description: Render JavaScript with headless Chromium ("true"/"false").
    default: "false"
  extra-args:
    description: Extra arguments for `ranq audit`.
    default: ""
  pagespeed-api-key:
    description: Optional free PageSpeed Insights API key (pass a secret).
    default: ""
  python-version:
    description: Python version to use.
    default: "3.11"

outputs:
  report-dir:
    description: Directory containing report.html, report.md and report.json.
    value: ${{ steps.audit.outputs.report-dir }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Ranq
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RENDER: ${{ inputs.render }}
      run: |
        python -m pip install --quiet "$ACTION_PATH"
        if [ "$RENDER" = "true" ]; then playwright install --with-deps chromium; fi
    - name: Audit
      id: audit
      shell: bash
      env:
        PAGESPEED_API_KEY: ${{ inputs.pagespeed-api-key }}
        RANQ_URL: ${{ inputs.url }}
        MAX_PAGES: ${{ inputs.max-pages }}
        FAIL_ON: ${{ inputs.fail-on }}
        RENDER: ${{ inputs.render }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set +e
        args=(audit "$RANQ_URL" --max-pages "$MAX_PAGES" --fail-on "$FAIL_ON" -o ranq-report)
        if [ "$RENDER" = "true" ]; then args+=(--render); fi
        read -ra extra <<< "$EXTRA_ARGS"
        ranq "${args[@]}" "${extra[@]}"
        status=$?
        echo "report-dir=ranq-report" >> "$GITHUB_OUTPUT"
        if [ -f ranq-report/report.md ]; then
          head -c 60000 ranq-report/report.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $status
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ranq-report
        path: ranq-report
